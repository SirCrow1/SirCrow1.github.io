<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spirit Warrior</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen flex flex-col items-center p-4 transition-colors duration-200">

    <header class="w-full max-w-3xl bg-white dark:bg-gray-800 shadow-md rounded-lg p-6 mb-6 text-center transition-colors duration-200">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-2xl font-bold">Spirit Warrior</h1>
            <!-- Theme Toggle Button -->
            <button onclick="toggleTheme()" class="px-3 py-1 bg-gray-200 dark:bg-gray-700 text-sm rounded hover:bg-gray-300 dark:hover:bg-gray-600 transition">
                🌙 / ☀️ Mode
            </button>
        </div>
        
        <!-- Volume Selection Menu -->
        <div id="selector-container" class="flex flex-wrap justify-center gap-2">
            <button onclick="loadBook('pdf/vol1.pdf')" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition">Vol 1</button>
            <button onclick="loadBook('pdf/vol2.pdf')" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition">Vol 2</button>
            <button onclick="loadBook('pdf/vol3.pdf')" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition">Vol 3</button>
        </div>

        <!-- Reader Controls -->
        <div id="reader-controls" class="hidden flex flex-wrap justify-between items-center gap-4 mt-6 pt-4 border-t dark:border-gray-700">
            <button onclick="goBack()" class="px-3 py-1 bg-gray-500 text-white rounded hover:bg-gray-600 transition">← Back</button>
            <div class="flex items-center space-x-2">
                <button id="prev" class="px-3 py-1 bg-blue-600 text-white rounded hover:bg-blue-700 transition">Previous</button>
                <span class="text-sm text-gray-600 dark:text-gray-400">
                    Page <span id="page-num">1</span> of <span id="page-count">1</span>
                </span>
                <button id="next" class="px-3 py-1 bg-blue-600 text-white rounded hover:bg-blue-700 transition">Next</button>
            </div>
            <button onclick="toggleComments()" class="px-3 py-1 bg-green-600 text-white rounded hover:bg-green-700 transition">💬 Comments</button>
        </div>
    </header>

    <!-- Canvas Viewer -->
    <main id="viewer-container" class="hidden w-full max-w-3xl flex justify-center bg-white dark:bg-gray-800 shadow-md rounded-lg p-4 overflow-auto mb-6 transition-colors duration-200">
        <canvas id="pdf-render" class="max-w-full h-auto shadow"></canvas>
    </main>

    <!-- Comments Section -->
    <section id="comments-section" class="hidden w-full max-w-3xl bg-white dark:bg-gray-800 shadow-md rounded-lg p-6 transition-colors duration-200">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-lg font-bold">Page Comments</h2>
            <button onclick="toggleAdmin()" id="admin-btn" class="text-xs text-gray-400 dark:text-gray-300 underline">Admin Login</button>
        </div>

        <div class="flex flex-col gap-2 mb-4">
            <input type="text" id="username-input" placeholder="Your name (optional)..." class="border dark:border-gray-700 bg-transparent rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 w-1/3">
            <div class="flex gap-2">
                <input type="text" id="comment-input" placeholder="Write a comment..." class="flex-grow border dark:border-gray-700 bg-transparent rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button onclick="addComment()" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition">Post</button>
            </div>
        </div>
        <div id="comments-list" class="space-y-3"></div>
    </section>

    <script>
        // Theme initialization: Default to dark unless explicitly saved as light
        if (localStorage.getItem('theme') === 'light') {
            document.documentElement.classList.remove('dark');
        } else {
            document.documentElement.classList.add('dark');
        }

        function toggleTheme() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        }

        // Supabase configuration
        const SUPABASE_URL = 'https://rhnceiumgsnbzkssbrnh.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Mcs4utHHAnFEE5P3UGOMVw_43WYbkt5';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Persistent User ID for tracking own comments
        let userId = localStorage.getItem('novel_user_id');
        if (!userId) {
            userId = 'user_' + Math.random().toString(36).substring(2, 15);
            localStorage.setItem('novel_user_id', userId);
        }

        let isAdmin = localStorage.getItem('novel_is_admin') === 'true';

        function toggleAdmin() {
            if (isAdmin) {
                localStorage.setItem('novel_is_admin', 'false');
                isAdmin = false;
                alert('Logged out of Admin mode.');
            } else {
                let pass = prompt('Enter admin password:');
                if (pass === 'admin123') {
                    localStorage.setItem('novel_is_admin', 'true');
                    isAdmin = true;
                    alert('Admin mode enabled!');
                } else if (pass !== null) {
                    alert('Incorrect password.');
                }
            }
            fetchComments();
        }

        let pdfDoc = null,
            pageNum = 1,
            pageRendering = false,
            pageNumPending = null,
            scale = 1.2,
            canvas = document.getElementById('pdf-render'),
            ctx = canvas.getContext('2d'),
            currentUrl = '';

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        function loadBook(url) {
            currentUrl = url;
            document.getElementById('selector-container').classList.add('hidden');
            document.getElementById('reader-controls').classList.remove('hidden');
            document.getElementById('viewer-container').classList.remove('hidden');

            pageNum = 1;
            pdfjsLib.getDocument(url).promise.then(function(pdfDoc_) {
                pdfDoc = pdfDoc_;
                document.getElementById('page-count').textContent = pdfDoc.numPages;
                renderPage(pageNum);
            }).catch(function() {
                document.getElementById('page-count').textContent = '1';
                fetchComments();
            });
        }

        function goBack() {
            document.getElementById('selector-container').classList.remove('hidden');
            document.getElementById('reader-controls').classList.add('hidden');
            document.getElementById('viewer-container').classList.add('hidden');
            document.getElementById('comments-section').classList.add('hidden');
            pdfDoc = null;
        }

        function toggleComments() {
            let section = document.getElementById('comments-section');
            section.classList.toggle('hidden');
        }

        function renderPage(num) {
            if (!pdfDoc) return;
            pageRendering = true;
            pdfDoc.getPage(num).then(function(page) {
                let viewport = page.getViewport({ scale: scale });
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                let renderContext = { canvasContext: ctx, viewport: viewport };
                let renderTask = page.render(renderContext);

                renderTask.promise.then(function() {
                    pageRendering = false;
                    if (pageNumPending !== null) {
                        renderPage(pageNumPending);
                        pageNumPending = null;
                    }
                });
            });

            document.getElementById('page-num').textContent = num;
            fetchComments();
        }

        function queueRenderPage(num) {
            if (pageRendering) {
                pageNumPending = num;
            } else {
                renderPage(num);
            }
        }

        document.getElementById('prev').addEventListener('click', () => {
            if (pageNum <= 1) return;
            pageNum--;
            if (pdfDoc) {
                queueRenderPage(pageNum);
            } else {
                document.getElementById('page-num').textContent = pageNum;
                fetchComments();
            }
        });

        document.getElementById('next').addEventListener('click', () => {
            if (pdfDoc && pageNum >= pdfDoc.numPages) return;
            pageNum++;
            if (pdfDoc) {
                queueRenderPage(pageNum);
            } else {
                document.getElementById('page-num').textContent = pageNum;
                fetchComments();
            }
        });

        async function addComment() {
            let usernameInput = document.getElementById('username-input');
            let commentInput = document.getElementById('comment-input');
            
            let username = usernameInput.value.trim() || 'Anonymous';
            let text = commentInput.value.trim();
            if (!text) return;

            const { error } = await supabaseClient
                .from('comments')
                .insert([{ book_url: currentUrl, page_num: pageNum, username: username, text: text, user_id: userId }]);

            if (error) {
                console.error("Error posting comment:", error);
            } else {
                commentInput.value = '';
                fetchComments();
            }
        }

        async function deleteComment(id) {
            const { error } = await supabaseClient
                .from('comments')
                .delete()
                .eq('id', id);

            if (error) {
                console.error("Error deleting comment:", error);
            } else {
                fetchComments();
            }
        }

        async function fetchComments() {
            let list = document.getElementById('comments-list');
            list.innerHTML = '<p class="text-sm text-gray-400">Loading comments...</p>';

            const { data: comments, error } = await supabaseClient
                .from('comments')
                .select('*')
                .eq('book_url', currentUrl)
                .eq('page_num', pageNum)
                .order('created_at', { ascending: true });

            list.innerHTML = '';

            if (error || !comments || comments.length === 0) {
                list.innerHTML = '<p class="text-sm text-gray-400">No comments for this page yet.</p>';
                return;
            }

            comments.forEach(c => {
                let div = document.createElement('div');
                div.className = 'bg-gray-50 dark:bg-gray-700 border dark:border-gray-600 p-3 rounded text-sm flex justify-between items-center';
                
                let canDelete = isAdmin || (c.user_id === userId);
                let deleteBtnHtml = canDelete ? `<button onclick="deleteComment(${c.id})" class="text-red-500 hover:text-red-700 text-xs font-bold px-2 py-1 ml-2">✕</button>` : '';

                div.innerHTML = `
                    <div>
                        <span class="font-bold text-blue-600 dark:text-blue-400">${c.username || 'Anonymous'}:</span> 
                        <span class="text-gray-700 dark:text-gray-200">${c.text}</span>
                    </div>
                    ${deleteBtnHtml}
                `;
                list.appendChild(div);
            });

            document.getElementById('admin-btn').textContent = isAdmin ? 'Admin (Logged In)' : 'Admin Login';
        }
    </script>
</body>
</html>
